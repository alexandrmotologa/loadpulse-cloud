<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <clipPath id="squircle-clip">
      <rect x="24" y="24" width="976" height="976" rx="220" />
    </clipPath>

    <!-- Pulse Orange Brand Gradient -->
    <linearGradient id="pulse-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="amber-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <!-- Electric Cyan Optic & Telemetry Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="cyan-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>

    <!-- Obsidian & Slate Armor Shading -->
    <linearGradient id="slate-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#080b11"/>
    </linearGradient>

    <linearGradient id="slate-facet-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <linearGradient id="slate-facet-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="slate-facet-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.14" />
    </filter>

    <filter id="cyan-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f5ff" flood-opacity="0.65" />
    </filter>

    <filter id="pulse-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f97316" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Luxury White Squircle Container -->
  <rect x="24" y="24" width="976" height="976" rx="220" fill="#ffffff" stroke="#e2e8f0" stroke-width="6" />

  <g clip-path="url(#squircle-clip)">
    <g transform="translate(512, 520)" filter="url(#subtle-shadow)">

      <!-- 1. The Hexagonal Architecture Gateway (Massive 40px Outer Frame) -->
      <polygon points="
        0,-390
        338,-195
        338,195
        0,390
        -338,195
        -338,-195
      " fill="none" stroke="#0f172a" stroke-width="40" stroke-linejoin="round" />

      <!-- Inner Hexagon Accent (Pulse Orange Telemetry Precision Dashed Line) -->
      <polygon points="
        0,-355
        307,-177
        307,177
        0,355
        -307,177
        -307,-177
      " fill="none" stroke="#f97316" stroke-width="4" opacity="0.45" stroke-dasharray="16, 12" />

      <!-- Telemetry Corner Nodes -->
      <circle cx="0" cy="-355" r="6.5" fill="#f97316" />
      <circle cx="307" cy="-177" r="6.5" fill="#00f5ff" />
      <circle cx="307" cy="177" r="6.5" fill="#00f5ff" />
      <circle cx="0" cy="355" r="6.5" fill="#f97316" />
      <circle cx="-307" cy="177" r="6.5" fill="#00f5ff" />
      <circle cx="-307" cy="-177" r="6.5" fill="#00f5ff" />

      <!-- 2. CLOUD TELEMETRY HALO & BROADCAST ARCS (At the Top Gateway Node) -->
      <!-- Concentric Wireless Cloud Pulse Arcs -->
      <path d="M -90,-310 A 105 105 0 0 1 90,-310" fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round" opacity="0.85" />
      <path d="M -60,-325 A 70 70 0 0 1 60,-325" fill="none" stroke="#fb923c" stroke-width="5" stroke-linecap="round" opacity="0.9" />
      <path d="M -30,-340 A 35 35 0 0 1 30,-340" fill="none" stroke="#fde047" stroke-width="4" stroke-linecap="round" />

      <!-- 3. THE OBSIDIAN CHEETAH MASCOT SILHOUETTE (Acinonyx Jubatus) -->
      <!-- Watertight Base Silhouette Path -->
      <path d="
        M 0,-180
        L 55,-175
        L 95,-185
        L 145,-265
        L 175,-245
        L 155,-160
        L 190,-70
        L 275,70
        L 295,195
        L 210,225
        L 220,300
        L 120,320
        L 0,360
        L -120,320
        L -220,300
        L -210,225
        L -295,195
        L -275,70
        L -190,-70
        L -155,-160
        L -175,-245
        L -145,-265
        L -95,-185
        L -55,-175
        Z
      " fill="url(#slate-body)" stroke="#0f172a" stroke-width="8" stroke-linejoin="round" />

      <!-- Rounded Athletic Cheetah Ears -->
      <!-- Left Ear Inner -->
      <polygon points="-95,-185 -145,-265 -165,-240 -125,-165" fill="url(#pulse-gradient)" />
      <!-- Right Ear Inner -->
      <polygon points="95,-185 145,-265 165,-240 125,-165" fill="url(#pulse-gradient)" />

      <!-- Ear Outer Shadow Shell -->
      <polygon points="-145,-265 -175,-245 -155,-160 -125,-165 -165,-240" fill="#9a3412" opacity="0.4" />
      <polygon points="145,-265 175,-245 155,-160 125,-165 165,-240" fill="#9a3412" opacity="0.4" />

      <!-- Shoulder Muscle Plates (Aerodynamic Facets) -->
      <!-- Left Shoulder Plate -->
      <polygon points="-190,-70 -275,70 -210,130 -160,15" fill="#1e293b" stroke="#334155" stroke-width="4" />
      <polygon points="-275,70 -295,195 -210,225 -210,130" fill="#0f172a" />
      <polygon points="-265,85 -280,180 -225,190" fill="url(#pulse-gradient)" opacity="0.9" />

      <!-- Right Shoulder Plate -->
      <polygon points="190,-70 275,70 210,130 160,15" fill="#1e293b" stroke="#334155" stroke-width="4" />
      <polygon points="275,70 295,195 210,225 210,130" fill="#0f172a" />
      <polygon points="265,85 280,180 225,190" fill="url(#pulse-gradient)" opacity="0.9" />

      <!-- Cheetah Cranium & Forehead (Origami Planes) -->
      <polygon points="0,-180 55,-110 0,-50 -55,-110" fill="url(#slate-facet-light)" stroke="#0f172a" stroke-width="3" />
      <polygon points="0,-180 0,-50 -55,-110" fill="url(#slate-facet-mid)" />

      <!-- Crown Cloud Beacon Crystal (Speed Surge Node) -->
      <polygon points="0,-175 -18,-135 0,-115 18,-135" fill="url(#amber-accent)" filter="url(#pulse-bloom)" />
      <circle cx="0" cy="-145" r="4" fill="#ffffff" />

      <!-- Temples & Brow Ridges -->
      <polygon points="-55,-110 -125,-70 -85,-20 -38,-40" fill="url(#slate-facet-mid)" stroke="#0f172a" stroke-width="3" />
      <polygon points="55,-110 125,-70 85,-20 38,-40" fill="url(#slate-facet-light)" stroke="#0f172a" stroke-width="3" />

      <!-- Feline Nasal Bridge (Tapered Cheetah Muzzle) -->
      <polygon points="0,-50 38,-40 34,45 0,65" fill="url(#slate-facet-light)" stroke="#0f172a" stroke-width="3" />
      <polygon points="0,-50 -38,-40 -34,45 0,65" fill="url(#slate-facet-mid)" stroke="#0f172a" stroke-width="3" />

      <!-- Cheeks & Jowls (Sculpted Feline Aerodynamics) -->
      <polygon points="-38,-40 -34,45 -85,35 -85,-20" fill="#0f172a" />
      <polygon points="38,-40 34,45 85,35 85,-20" fill="url(#slate-facet-mid)" />

      <polygon points="-85,-20 -125,-70 -160,15 -85,35" fill="url(#slate-facet-dark)" />
      <polygon points="85,-20 125,-70 160,15 85,35" fill="url(#slate-facet-light)" />

      <!-- SIGNATURE CHEETAH TEAR-STRIPES (Iconic Black Facial Tracks) -->
      <!-- Left Tear Line -->
      <polygon points="-38,-35 -34,45 -48,70 -58,65 -45,-15" fill="#020617" stroke="#000000" stroke-width="1.5" />
      <!-- Right Tear Line -->
      <polygon points="38,-35 34,45 48,70 58,65 45,-15" fill="#020617" stroke="#000000" stroke-width="1.5" />

      <!-- Feline Eyes (Piercing Electric Cyan Optics) -->
      <!-- Left Eye -->
      <polygon points="-80,-38 -38,-30 -48,-12 -88,-22" fill="url(#cyan-glow)" stroke="#00f5ff" stroke-width="2" filter="url(#cyan-bloom)" />
      <circle cx="-62" cy="-24" r="4.5" fill="#ffffff" />
      <polygon points="-65,-33 -55,-31 -59,-16 -68,-18" fill="#070a13" opacity="0.85" />

      <!-- Right Eye -->
      <polygon points="80,-38 38,-30 48,-12 88,-22" fill="url(#cyan-glow)" stroke="#00f5ff" stroke-width="2" filter="url(#cyan-bloom)" />
      <circle cx="62" cy="-24" r="4.5" fill="#ffffff" />
      <polygon points="65,-33 55,-31 59,-16 68,-18" fill="#070a13" opacity="0.85" />

      <!-- Feline Nose Leather (Pulse Orange Cloud Port) -->
      <polygon points="0,42 -25,36 -18,60 0,68" fill="#c2410c" />
      <polygon points="0,42 25,36 18,60 0,68" fill="url(#pulse-gradient)" />

      <!-- Chin & Jaw Line -->
      <polygon points="0,68 -22,75 0,105 22,75" fill="#0f172a" />

      <!-- 4. HERALDIC LOADPULSE CHEST SHIELD: The Cloud Telemetry Engine Core -->
      <!-- Pure White Clean Emblem Container -->
      <polygon points="
        0,135
        88,185
        88,285
        0,335
        -88,285
        -88,185
      " fill="#ffffff" stroke="#0f172a" stroke-width="10" stroke-linejoin="round" />

      <!-- Inside Chest Shield: The Dual Reactive ECG Pulse Waveform -->
      <polyline points="-68,235 -42,235 -25,195 -8,280 8,185 25,270 44,235 68,235"
        fill="none" stroke="#c2410c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
      <polyline points="-68,235 -42,235 -25,195 -8,280 8,185 25,270 44,235 68,235"
        fill="none" stroke="url(#pulse-gradient)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#pulse-bloom)" />

      <!-- Telemetry Peak Indicator Dots -->
      <circle cx="8" cy="185" r="5.5" fill="#f97316" />
      <circle cx="8" cy="185" r="3" fill="#ffffff" />

      <circle cx="-8" cy="280" r="5.5" fill="#00f5ff" />
      <circle cx="-8" cy="280" r="3" fill="#ffffff" />

      <!-- 5. Wireless Telemetry & On-Demand Dispatch Node (Base Indicator) -->
      <g transform="translate(0, 360)">
        <circle cx="-50" cy="-15" r="9" fill="#f97316" stroke="#0f172a" stroke-width="3.5" />
        <line x1="-38" y1="-15" x2="38" y2="-15" stroke="#00f5ff" stroke-width="5" stroke-dasharray="6,4" />
        <polygon points="45,-15 33,-21 33,-9" fill="#00f5ff" />
        <circle cx="-50" cy="-15" r="3.5" fill="#ffffff" />
      </g>

    </g>
  </g>
</svg>